services:
  backend:
    build: ./backend
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: sqlite:///./trustscan.db
      UPLOAD_DIR: /app/uploads
      MAX_UPLOAD_BYTES: 52428800
      CORS_ORIGINS: "*"
    volumes:
      - ./backend:/app
      - trustscan_uploads:/app/uploads
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
  frontend:
    build: ./frontend
    ports: ["3000:3000"]
    environment:
      NEXT_PUBLIC_API_BASE: https://trustscan-api-q2s4.onrender.com
    depends_on: [backend]
volumes:
  trustscan_uploads:
